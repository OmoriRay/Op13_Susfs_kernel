name: OP13 BakaSU Extreme V2

on:
  workflow_dispatch:
    inputs:
      memory_bundle_only:
        description: Package the pinned lab-thin-max Image with the memory companion; no kernel compilation
        type: boolean
        default: false
      prepared_run:
        description: Existing successful source snapshot run, or 0 to prepare sources
        type: string
        default: '0'
      variants:
        description: JSON array of profiles to compile
        type: string
        default: '["lab-thin-adios33","lab-thin-oryon","lab-thin-max"]'

permissions:
  contents: read
  actions: read

concurrency:
  group: bakasu-extreme-v2-${{ github.ref }}-${{ inputs.variants }}
  cancel-in-progress: false

jobs:
  prepare:
    if: inputs.prepared_run == '0' && !inputs.memory_bundle_only
    name: Prepare pinned OEM sources and current SUSFS
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Validate ZRAM A/B codec and module
        if: contains(inputs.variants, 'lab-thin-zram-ab')
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mksh liblz4-1
          mkdir -p reports/codec downloads
          curl --fail --location --retry 3 https://codeload.github.com/lz4/lz4/tar.gz/ebb370ca83af193212df4dcbadcc5d87bc0de2f0 -o downloads/lz4.tar.gz
          python3 tests/zram/run_codec.py --archive downloads/lz4.tar.gz --out reports/codec
          OP13MEM_TEST_SHELL=/bin/mksh python3 -m unittest discover -s tests/memory -v 2>&1 | tee reports/module-tests.log
      - name: Prepare pinned upstream integration
        run: python3 scripts/extreme/prepare.py
      - name: Upload prepared source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: OP13-BakaSU-V2-prepared-sources
          path: prepared-sources.tar.zst
          compression-level: 0
          retention-days: 7
      - name: Upload source audit and exact conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP13-BakaSU-V2-source-audit
          path: reports/
          retention-days: 14
          if-no-files-found: error
  build:
    name: Build ${{ matrix.variant }}
    needs: prepare
    if: always() && !inputs.memory_bundle_only && (needs.prepare.result == 'success' || (inputs.prepared_run != '0' && inputs.prepared_run != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential bc bison flex gawk libssl-dev libelf-dev libncurses-dev zlib1g-dev dwarves python3-pyelftools zstd lz4 cpio rsync
          sudo fallocate -l 8G /swapfile-op13
          sudo chmod 600 /swapfile-op13
          sudo mkswap /swapfile-op13
          sudo swapon /swapfile-op13
      - uses: actions/download-artifact@v4
        with:
          name: OP13-BakaSU-V2-prepared-sources
          github-token: ${{ github.token }}
          run-id: ${{ inputs.prepared_run == '0' && github.run_id || inputs.prepared_run }}
      - name: Extract prepared source tree
        run: |
          mkdir -p kernel_workspace
          tar --zstd -xf prepared-sources.tar.zst -C kernel_workspace
          rm prepared-sources.tar.zst
      - name: Prepare LLVM and final configuration
        env:
          BUILD_PROFILE: ${{ matrix.variant }}
        run: bash scripts/extreme/build.sh "$BUILD_PROFILE" prepare
      - name: Compile key objects and check interconnect CRCs
        env:
          BUILD_PROFILE: ${{ matrix.variant }}
        run: bash scripts/extreme/build.sh "$BUILD_PROFILE" precheck
      - name: Compile Image and modules and check vendor imports
        env:
          BUILD_PROFILE: ${{ matrix.variant }}
        run: bash scripts/extreme/build.sh "$BUILD_PROFILE" compile
      - name: Package and inspect AK3
        env:
          BUILD_PROFILE: ${{ matrix.variant }}
        run: bash scripts/extreme/build.sh "$BUILD_PROFILE" package
      - name: Pair the newly compiled ZRAM AB Image and module
        if: matrix.variant == 'lab-thin-zram-ab'
        run: python3 scripts/zram/package.py
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP13-BakaSU-V2-${{ matrix.variant }}-audit
          path: |
            reports/
            kernel_workspace/out-*/arch/arm64/boot/Image
            kernel_workspace/out-*/Module.symvers
          retention-days: 14
      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP13-BakaSU-V2-${{ matrix.variant }}
          path: artifacts/
          compression-level: 0
          retention-days: 14
  memory_bundle:
    if: inputs.memory_bundle_only
    uses: ./.github/workflows/Package_OP13_Memory.yml
